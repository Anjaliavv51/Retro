name: 🤖 Retro Daily Automated Contributor Agent

on:
  schedule:
    # Runs 4 times daily (04:00, 10:00, 16:00, 22:00 UTC) to ensure runs are never delayed or missed
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without creating git commits'
        required: true
        type: boolean
        default: false
      max_commits:
        description: 'Maximum number of meaningful commits allowed (1-10)'
        required: true
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-maintenance:
    name: Execute Daily Quality & Maintenance Tasks
    runs-on: ubuntu-latest

    # Master kill-switch toggle via Repository Variables
    # Set vars.DAILY_AGENT_ENABLED = 'false' in Settings > Secrets and variables > Actions > Variables to pause
    if: vars.DAILY_AGENT_ENABLED != 'false'

    steps:
      - name: 🕒 Record Execution Timestamp & Date
        id: meta
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: npm ci || npm install

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 🧪 Run Baseline Regression Verification
        run: |
          echo "Running baseline test suites before agent execution..."
          npm run test:db-agent

      - name: 👤 Configure Git Identity for Profile Contribution Credit
        run: |
          git config user.name "Anjaliavv51"
          git config user.email "plpanjali05@gmail.com"

      - name: 🚀 Run Retro Maintenance & Contribution Agent
        id: agent
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_COMMITS: ${{ github.event.inputs.max_commits || '10' }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          node scripts/maintenance-agent/runner.js \
            --no-branch \
            --max-commits "$MAX_COMMITS" \
            $DRY_FLAG

      - name: 🔍 Inspect Created Commits on Main
        id: check_commits
        run: |
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD || echo 0)
          echo "commits_count=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          echo "Detected ${COMMITS_AHEAD} new commit(s) on main."

      - name: 📤 Push Commits Directly to Main
        if: steps.check_commits.outputs.commits_count > 0 && github.event.inputs.dry_run != 'true'
        run: |
          git push origin main
